<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binary Control</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside><div class="brand">Binary <span>Insights</span></div><nav>
    <button data-view="dashboard" class="active">Visão geral</button>
    <button data-view="customers">Clientes</button><button data-view="deployments">Instalações</button>
    <button data-view="agents">Agentes</button><button data-view="alerts">Alertas</button>
  </nav></aside>
  <main><header><div><small>CENTRAL OPERACIONAL</small><h1 id="title">Visão geral</h1></div><span id="connection">Não autenticado</span></header>
  <section id="login"><h2>Acesso interno</h2><p>Entre com sua conta da Binary Insights.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="connect">Entrar</button></section>
  <section id="content" hidden><div id="cards" class="cards"></div><div class="panel"><div class="panel-title"><h2 id="table-title">Registros</h2><div><button id="new-record">Novo</button><button id="refresh">Atualizar</button></div></div><div id="table"></div></div></section>
  <dialog id="modal"><form id="record-form" method="dialog"><div class="panel-title"><h2 id="form-title">Novo registro</h2><button value="cancel">Fechar</button></div><div id="form-fields"></div><button id="save" value="default">Salvar</button></form></dialog>
  </main><script src="/app.js"></script>
</body></html>
