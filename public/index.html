<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binary Control</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <aside><div class="brand">Binary <span>Insights</span></div><nav>
    <button data-view="dashboard" class="active">Visão geral</button>
    <button data-view="customers">Clientes</button><button data-view="deployments">Instalações</button>
    <button data-view="agents">Agentes</button><button data-view="alerts">Alertas</button>
  </nav></aside>
  <main><header><div><small>CENTRAL OPERACIONAL</small><h1 id="title">Visão geral</h1></div><span id="connection">Não autenticado</span></header>
  <section id="login"><h2>Acesso interno</h2><p>Informe o token administrativo. Ele fica apenas nesta aba.</p><input id="token" type="password" placeholder="Token interno"><button id="connect">Conectar</button></section>
  <section id="content" hidden><div id="cards" class="cards"></div><div class="panel"><div class="panel-title"><h2 id="table-title">Instalações recentes</h2><button id="refresh">Atualizar</button></div><div id="table"></div></div></section>
  </main><script src="/app.js"></script>
</body></html>
